<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Oficial - Team Penning</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .topbar {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    /* 1. TOPO: Identificação da Competição e Fase */
    .header-block {
      width: 50%;
      background: #000000;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 8px 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ffffff;
    }

    .header-subtitle {
      font-size: 1.1rem;
      margin: 4px 0 0 0;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* 2. TRIO EM PISTA */
    .pista-block {
      width: 50%;
      background: #000000;
      border: 3px solid #2563eb;
      border-radius: 8px;
      padding: 8px 20px;
      text-align: center;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
    }

    .pista-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pista-names {
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      margin: 2px 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pista-details {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 1rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    /* 3. CENTRO: GRID DINÂMICO DE BATERIAS */
    .middle-grid {
      display: grid;
      /* Define colunas adaptáveis dinamicamente via JS ou css variable */
      grid-template-columns: repeat(var(--num-cols, 2), 1fr);
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .ranking-box {
      background: #000000;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .box-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #334155;
      color: #4ade80;
      text-align: center;
    }

    /* 4. BASE: Lista de Trios que vem em seguida */
    .bottom-block {
      background: #000000;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px;
      height: 200px;
      display: flex;
      flex-direction: column;
    }

    /* Estilos das Tabelas Universais */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      text-align: left;
    }

    .data-table th {
      background: #1e293b;
      color: #94a3b8;
      padding: 6px 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }

    .data-table td {
      padding: 5px 10px;
      border-bottom: 1px solid #1e293b;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .table-container {
      overflow-y: auto;
      flex: 1;
    }

    .badge-lote {
      background: #3b82f6;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .tag-qualified {
      color: #4ade80;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <!-- 1. TOPO: Identificação da Competição e Fase -->
    <header class="header-block">
      <h1 class="header-title" id="panel-event-title">🏁 TEAM PENNING</h1>
      <div class="header-subtitle" id="panel-phase-title">AGUARDANDO ATIVAÇÃO DO PAINEL...</div>
    </header>

    <!-- 2. TRIO EM PISTA -->
    <section class="pista-block">
      <div class="pista-label">🤠 TRIO EM PISTA AGORA</div>
      <div class="pista-names" id="current-trio-names">Nenhum trio na pista</div>
      <div class="pista-details">
        <span><strong>Ordem:</strong> <span id="current-trio-order">--</span></span>
        <span><strong>Senha:</strong> <span id="current-trio-senha">--</span></span>
        <span><strong>Lote:</strong> <span id="current-trio-lote">--</span></span>
      </div>
    </section>
  </div>

  <main id="main-content" style="display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0;">
    
    <!-- 3. CLASSIFICAÇÃO DAS BATERIAS (DINÂMICO) -->
    <section class="middle-grid" id="batteries-container">
      <!-- As colunas das baterias serão renderizadas aqui dinamicamente pelo JS -->
    </section>

    <!-- 4. LISTA DE TRIOS QUE VEM EM SEGUIDA -->
    <section class="bottom-block">
      <div class="box-title" style="color: #cbd5e1; text-align: left; border-bottom: none; margin-bottom: 4px;">
        📋 PRÓXIMOS A CORRER (SEQUÊNCIA DA ETAPA)
      </div>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Ordem</th>
              <th>Senha</th>
              <th>Integrantes do Trio</th>
              <th>Lote</th>
            </tr>
          </thead>
          <tbody id="tbody-next-trios">
            <tr><td colspan="4" style="text-align:center;">Nenhum trio na fila</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- FIREBASE REALTIME DATABASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDVZSlNvtLOER3YdotvGi-G7VvDtSQwV7M",
      authDomain: "sistema-team-penning.firebaseapp.com",
      databaseURL: "https://sistema-team-penning-default-rtdb.firebaseio.com",
      projectId: "sistema-team-penning",
      storageBucket: "sistema-team-penning.firebasestorage.app",
      messagingSenderId: "1025888364244",
      appId: "1:1025888364244:web:d4c5d0582899a855ddbd41"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let state = {
      config: {},
      trios: {},
      activePanel: { mode: 'none', category: '' }
    };

    // Função utilitária para calcular o lote/bateria
    function getBatchNumber(startOrder) {
      if (!startOrder) return 1;
      const batchSize = state.config.batchSize || 25;
      const numBatteries = state.config.numBatteries || 1;
      const blockIndex = Math.floor((startOrder - 1) / batchSize);
      return (blockIndex % numBatteries) + 1;
    }

    // Escuta Configurações
    onValue(ref(db, 'config'), (snap) => {
      if (snap.exists()) {
        state.config = snap.val();
        document.getElementById('panel-event-title').innerText = `🏁 ${state.config.eventName || 'TEAM PENNING'}`;
      }
      renderDashboard();
    });

    // Escuta Trios
    onValue(ref(db, 'trios'), (snap) => {
      state.trios = snap.val() || {};
      renderDashboard();
    });

    // Escuta Comando do Operador
    onValue(ref(db, 'activePanel'), (snap) => {
      if (snap.exists()) {
        state.activePanel = snap.val();
      }
      renderDashboard();
    });

    function renderDashboard() {
      const activeCat = state.activePanel.category;
      const mode = state.activePanel.mode || 'none';
      const phaseTitle = document.getElementById('panel-phase-title');
      
      if (!activeCat && mode !== 'placar') {
        phaseTitle.innerText = "AGUARDANDO SELEÇÃO DE ETAPA EM PISTA...";
        return;
      }

      phaseTitle.innerText = `CATEGORIA: ${activeCat || 'GERAL'}`;

      // 1. Filtrar trios da categoria ativa
      const allCategoryTrios = Object.values(state.trios).filter(t => 
        (!activeCat || t.category === activeCat || t.catEmbutida === activeCat) && t.startOrder
      );

      allCategoryTrios.sort((a, b) => a.startOrder - b.startOrder);

      const pendingTrios = allCategoryTrios.filter(t => !t.result);
      const completedTrios = allCategoryTrios.filter(t => t.result);

      // -------------------------------------------------------------
      // A. TRIO EM PISTA
      // -------------------------------------------------------------
      const current = pendingTrios[0];
      if (current) {
        document.getElementById('current-trio-names').innerText = `${current.r1} • ${current.r2} • ${current.r3}`;
        document.getElementById('current-trio-order').innerText = `#${current.startOrder}`;
        document.getElementById('current-trio-senha').innerText = `#${current.senha}`;
        document.getElementById('current-trio-lote').innerText = `Lote ${getBatchNumber(current.startOrder)}`;
      } else {
        document.getElementById('current-trio-names').innerText = "✅ Prova Concluída nesta Etapa!";
        document.getElementById('current-trio-order').innerText = "--";
        document.getElementById('current-trio-senha').innerText = "--";
        document.getElementById('current-trio-lote').innerText = "--";
      }

      // -------------------------------------------------------------
      // B. PRÓXIMOS A CORRER
      // -------------------------------------------------------------
      const tbodyNext = document.getElementById('tbody-next-trios');
      const nextInLine = pendingTrios.slice(1, 6);

      if (nextInLine.length === 0) {
        tbodyNext.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum outro trio aguardando nesta etapa.</td></tr>`;
      } else {
        tbodyNext.innerHTML = nextInLine.map(t => `
          <tr>
            <td><strong style="color:#60a5fa;">#${t.startOrder}</strong></td>
            <td>Senha #${t.senha}</td>
            <td><strong>${t.r1}, ${t.r2}, ${t.r3}</strong></td>
            <td><span class="badge-lote">Lote ${getBatchNumber(t.startOrder)}</span></td>
          </tr>
        `).join('');
      }

      // -------------------------------------------------------------
      // C. RENDERIZAÇÃO DINÂMICA DAS BATERIAS
      // -------------------------------------------------------------
      const numBatteries = state.config.numBatteries || 1;
      const batteriesContainer = document.getElementById('batteries-container');

      // Atualiza a variável CSS para dividir o grid pelo nº de baterias
      batteriesContainer.style.setProperty('--num-cols', numBatteries);

      const sortLeaderboard = (a, b) => {
        if (a.result.bois !== b.result.bois) return b.result.bois - a.result.bois;
        return a.result.time - b.result.time;
      };

      const limit = state.config.qualifiedPerBatch || 10;
      let htmlBaterias = '';

      for (let i = 1; i <= numBatteries; i++) {
        // Filtra trios que competiram nesta bateria/lote específica
        const batchTrios = completedTrios
          .filter(t => getBatchNumber(t.startOrder) === i)
          .sort(sortLeaderboard);

        let tableRows = '';
        if (batchTrios.length === 0) {
          tableRows = `<tr><td colspan="4" style="text-align:center; color:#64748b;">Sem registros</td></tr>`;
        } else {
          tableRows = batchTrios.map((t, idx) => {
            const rank = idx + 1;
            const isClassified = rank <= limit && !t.result.isSAT;
            const timeDisplay = t.result.isSAT ? 'SAT' : `${Number(t.result.time).toFixed(3)}s`;

            return `
              <tr class="${isClassified ? 'tag-qualified' : ''}">
                <td><strong>${rank}º</strong></td>
                <td>${t.r1}, ${t.r2}, ${t.r3}</td>
                <td>${t.result.bois}b</td>
                <td><strong>${timeDisplay}</strong></td>
              </tr>
            `;
          }).join('');
        }

        htmlBaterias += `
          <div class="ranking-box">
            <div class="box-title">📊 Classificação - Lote ${i}</div>
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Pos</th>
                    <th>Trio</th>
                    <th>Bois</th>
                    <th>Tempo</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      batteriesContainer.innerHTML = htmlBaterias;
    }
  </script>
</body>
</html>
