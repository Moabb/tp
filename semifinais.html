<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semifinais - Team Penning Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #121212; color: #f8f9fa; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 25px; }
    header h1 { color: #ffb703; font-size: 1.6rem; }
    .btn { background: #ffb703; color: #000; font-weight: bold; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
    .card h2 { color: #2a9d8f; font-size: 1.2rem; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; font-size: 0.9rem; text-align: left; border-bottom: 1px solid #333; }
    th { color: #ffb703; background: #262626; }
    .btn-aprovar { background: #2a9d8f; color: #fff; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>🔥 GESTÃO DAS SEMIFINAIS</h1>
    <div>
      <a href="./admin.html" class="btn">⏱️ Prova (Admin)</a>
      <a href="./montar-final.html" class="btn">🏆 Grande Final</a>
    </div>
  </header>

  <main class="card">
    <h2>Trios Classificados na Semifinal</h2>
    <table id="tabelaSemifinais">
      <thead>
        <tr>
          <th>Posição</th>
          <th>Integrantes</th>
          <th>Tempo Acumulado</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4" style="text-align:center;">Carregando classificados...</td></tr>
      </tbody>
    </table>
  </main>

  <script type="module">
    import { auth, db, collection, query, where, orderBy, getDocs, addDoc, onAuthStateChanged } from "./firebase-config.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "./index.html";
      carregarSemifinalistas();
    });

    async function carregarSemifinalistas() {
      const q = query(
        collection(db, "trios"),
        where("status", "==", "CONCLUIDO"),
        where("penalidade", "==", "OK"),
        orderBy("tempo", "asc")
      );

      const snapshot = await getDocs(q);
      const tabela = document.querySelector("#tabelaSemifinais tbody");
      tabela.innerHTML = "";

      if (snapshot.empty) {
        tabela.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum trio elegível para semifinal.</td></tr>';
        return;
      }

      let posicao = 1;
      snapshot.forEach(docSnap => {
        const trio = docSnap.data();
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${posicao}</strong></td>
          <td>${trio.integrantes ? trio.integrantes.join(" / ") : "N/D"}</td>
          <td>${trio.tempo}s</td>
          <td>
            <button class="btn-aprovar" onclick="enviarParaFinal('${docSnap.id}', '${trio.categoria}')">Promover para Final</button>
          </td>
        `;
        tabela.appendChild(tr);
        posicao++;
      });
    }

    window.enviarParaFinal = async (idDoc, categoria) => {
      try {
        await addDoc(collection(db, "classificados"), {
          trioOriginalId: idDoc,
          categoria: categoria,
          faseOrigem: "SEMIFINAL",
          status: "PENDENTE",
          criadoEm: new Date()
        });
        alert("Trio enviado para a lista de qualificados da Grande Final!");
      } catch (err) {
        console.error("Erro ao enviar para final:", err);
      }
    };
  </script>
</body>
</html>
