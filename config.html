<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Configurações - Team Penning</title>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --primary: #059669; --accent: #f59e0b; --danger: #ef4444; --text-light: #f8fafc; --text-muted: #94a3b8; --input-bg: #0f172a; --border-color: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }
        header { background-color: #090d16; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        nav { display: flex; gap: 15px; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; padding: 6px 12px; border-radius: 6px; }
        nav a.active, nav a:hover { color: var(--text-light); background-color: var(--card-bg); }
        .container { padding: 24px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background-color: var(--card-bg); border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); }
        .card h2 { color: var(--accent); font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); color: white; border-radius: 6px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; background-color: var(--primary); color: white; }
    </style>
</head>
<body>
    <header>
        <div style="color:var(--accent); font-weight:bold;">🤠 TEAM PENNING</div>
        <nav>
            <a href="config.html" class="active">Parâmetros</a>
            <a href="cadastro.html">Inscrições / Trios</a>
            <a href="admin.html">Mesa do Juiz</a>
            <a href="painel.html" target="_blank">Painel (TV)</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>EDITAR EVENTO</h2>
            <div class="form-group">
                <label>Nome do Evento</label>
                <input type="text" id="evtNome" class="form-control">
            </div>
            <div class="form-group">
                <label>Data de Início</label>
                <input type="date" id="evtData" class="form-control">
            </div>
            <button class="btn" onclick="salvarConfig()">Salvar Evento</button>
        </div>

        <div class="card">
            <h2>EVENTO ATIVO</h2>
            <div id="resumoEvento" style="font-size: 0.95rem; color: var(--text-muted);">
                Carregando...
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function carregarTela() {
            const db = getDB();
            document.getElementById('evtNome').value = db.competicao.nome;
            document.getElementById('evtData').value = db.competicao.data;
            document.getElementById('resumoEvento').innerHTML = `
                <p><b>Nome:</b> ${db.competicao.nome}</p>
                <p><b>Data:</b> ${db.competicao.data}</p>
                <p><b>Categorias:</b> ${db.competicao.categorias.map(c => c.nome).join(', ')}</p>
            `;
        }

        function salvarConfig() {
            const db = getDB();
            db.competicao.nome = document.getElementById('evtNome').value;
            db.competicao.data = document.getElementById('evtData').value;
            saveDB(db);
            alert('Evento salvo com sucesso!');
            carregarTela();
        }

        carregarTela();
    </script>
</body>
</html>
