<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa do Juiz - Team Penning Pro</title>
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --gold: #ffb703; --green: #2a9d8f;
      --red: #e76f51; --text: #f8f9fa; --input: #2b2b2b; --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; }
    header h1 { color: var(--gold); font-size: 1.5rem; }
    .nav-btns { display: flex; gap: 8px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn-danger { background: var(--red); color: #fff; }

    .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card h2 { color: var(--gold); font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

    .timer-display { font-size: 3.5rem; font-family: monospace; font-weight: bold; color: var(--gold); text-align: center; background: #000; padding: 15px; border-radius: 8px; border: 2px solid var(--border); margin-bottom: 15px; }
    .timer-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-timer { padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .btn-start { background: var(--green); color: #fff; }
    .btn-stop { background: var(--red); color: #fff; }
    .btn-reset { background: #555; color: #fff; }

    .trio-info { background: #262626; padding: 15px; border-radius: 6px; border-left: 4px solid var(--gold); margin-bottom: 15px; }
    .trio-info h3 { font-size: 1.2rem; color: #fff; }
    .trio-info p { color: #aaa; font-size: 0.9rem; margin-top: 4px; }

    .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; background: var(--input); border: 1px solid #444; border-radius: 4px; color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; font-size: 0.85rem; text-align: left; border-bottom: 1px solid #333; }
    th { color: var(--gold); background: #1f1f1f; }
  </style>
</head>
<body>

  <header>
    <h1>⏱️ MESA DO JUIZ - TEAM PENNING</h1>
    <div class="nav-btns">
      <a href="./semifinais.html" class="btn">🔥 Semifinais</a>
      <a href="./montar-final.html" class="btn">🏆 Grande Final</a>
      <button class="btn btn-danger" id="btnSair">Sair</button>
    </div>
  </header>

  <div class="main-grid">
    <div>
      <section class="card">
        <h2>Trio Em Pista</h2>
        <div class="trio-info" id="boxTrioAtual">
          <h3 id="txtSenhaTrio">Senha: --</h3>
          <p id="txtIntegrantes">Aguardando carregamento de trio...</p>
          <p id="txtCategoriaFase">Categoria: -- | Fase: --</p>
        </div>

        <div class="timer-display" id="displayTempo">00.000</div>

        <div class="timer-controls">
          <button class="btn-timer btn-start" id="btnIniciar">INICIAR</button>
          <button class="btn-timer btn-stop" id="btnParar">PARAR</button>
          <button class="btn-timer btn-reset" id="btnZerar">ZERAR</button>
        </div>

        <form id="formResultado">
          <div class="form-row">
            <div class="form-group">
              <label for="inputBois">Qtd Bois Apascentados:</label>
              <select id="inputBois">
                <option value="3">3 Bois</option>
                <option value="2">2 Bois</option>
                <option value="1">1 Boi</option>
                <option value="0">0 Bois (SAT/SLA)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="inputPenalidade">Status da Corredor:</label>
              <select id="inputPenalidade">
                <option value="OK">Tempo Valido</option>
                <option value="SAT">SAT (Sem Aumento de Tempo)</option>
                <option value="BOI_INCORRETO">Boi Incorreto</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-start" style="width: 100%; padding: 12px; font-size: 1rem;">💾 Salvar Prova e Chamar Próximo</button>
        </form>
      </section>
    </div>

    <aside>
      <section class="card">
        <h2>Próximos da Fila</h2>
        <table id="tabelaFila">
          <thead>
            <tr>
              <th>Senha</th>
              <th>Integrantes</th>
              <th>Fase</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3" style="text-align: center; color: #777;">Carregando...</td></tr>
          </tbody>
        </table>
      </section>
    </aside>
  </div>

  <script type="module">
    import { auth, db, collection, query, where, orderBy, getDocs, updateDoc, doc, onAuthStateChanged, signOut } from "./firebase-config.js";

    let trioAtual = null;
    let timerInterval = null;
    let startTime = 0;
    let elapsedTime = 0;
    let timerRunning = false;

    const displayTempo = document.getElementById("displayTempo");

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "./index.html";
      carregarFila();
    });

    async function carregarFila() {
      const q = query(
        collection(db, "trios"), 
        where("status", "==", "AGUARDANDO"),
        orderBy("ordemPista", "asc")
      );

      const snapshot = await getDocs(q);
      const tabela = document.querySelector("#tabelaFila tbody");
      tabela.innerHTML = "";

      if (snapshot.empty) {
        tabela.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum trio na fila.</td></tr>';
        resetarTrioAtual();
        return;
      }

      let primeiro = true;
      snapshot.forEach(docSnap => {
        const item = { id: docSnap.id, ...docSnap.data() };
        if (primeiro) {
          trioAtual = item;
          exibirTrioAtual(item);
          primeiro = false;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${item.senha}</strong></td>
          <td>${item.integrantes ? item.integrantes.join(" / ") : "N/D"}</td>
          <td>${item.fase}</td>
        `;
        tabela.appendChild(tr);
      });
    }

    function exibirTrioAtual(item) {
      document.getElementById("txtSenhaTrio").innerText = `Senha: #${item.senha}`;
      document.getElementById("txtIntegrantes").innerText = item.integrantes ? item.integrantes.join(" / ") : "N/D";
      document.getElementById("txtCategoriaFase").innerText = `Categoria: ${item.categoria} | Fase: ${item.fase}`;
    }

    function resetarTrioAtual() {
      trioAtual = null;
      document.getElementById("txtSenhaTrio").innerText = "Senha: --";
      document.getElementById("txtIntegrantes").innerText = "Nenhum trio para correr.";
      document.getElementById("txtCategoriaFase").innerText = "Categoria: -- | Fase: --";
    }

    // Cronômetro
    document.getElementById("btnIniciar").addEventListener("click", () => {
      if (timerRunning) return;
      startTime = Date.now() - elapsedTime;
      timerInterval = setInterval(() => {
        elapsedTime = Date.now() - startTime;
        displayTempo.innerText = (elapsedTime / 1000).toFixed(3);
      }, 10);
      timerRunning = true;
    });

    document.getElementById("btnParar").addEventListener("click", () => {
      clearInterval(timerInterval);
      timerRunning = false;
    });

    document.getElementById("btnZerar").addEventListener("click", () => {
      clearInterval(timerInterval);
      timerRunning = false;
      elapsedTime = 0;
      displayTempo.innerText = "00.000";
    });

    document.getElementById("formResultado").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!trioAtual) {
        alert("Nenhum trio selecionado!");
        return;
      }

      const tempoFinal = (elapsedTime / 1000).toFixed(3);
      const bois = parseInt(document.getElementById("inputBois").value);
      const penalidade = document.getElementById("inputPenalidade").value;

      try {
        await updateDoc(doc(db, "trios", trioAtual.id), {
          status: "CONCLUIDO",
          tempo: penalidade === "OK" ? tempoFinal : "SAT",
          boisApascentados: bois,
          penalidade: penalidade,
          executadoEm: new Date()
        });

        // Limpa cronômetro e recarrega fila
        document.getElementById("btnZerar").click();
        carregarFila();
      } catch (err) {
        console.error("Erro ao salvar resultado:", err);
      }
    });

    document.getElementById("btnSair").addEventListener("click", () => signOut(auth));
  </script>
</body>
</html>
