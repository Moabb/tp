<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Penning Pro - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #121212; color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .login-card h1 { color: #ffb703; font-size: 1.8rem; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 12px; background: #2b2b2b; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 1rem; }
    .form-group input:focus { border-color: #ffb703; outline: none; }
    .btn-login { width: 100%; padding: 12px; background: #ffb703; border: none; color: #000; font-weight: bold; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-login:hover { background: #e0a000; }
    .error-msg { color: #e76f51; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🤠 TEAM PENNING</h1>
    <form id="formLogin">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="admin@teampenning.com" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Entrar no Sistema</button>
      <div class="error-msg" id="errorMsg">Usuário ou senha inválidos.</div>
    </form>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./firebase-config.js";

    const form = document.getElementById("formLogin");
    const errorMsg = document.getElementById("errorMsg");

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "./admin.html";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        window.location.href = "./admin.html";
      } catch (err) {
        errorMsg.innerText = "Falha ao autenticar. Verifique seus dados.";
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
